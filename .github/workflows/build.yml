# Tests Bookwyrm on Windows and on a Mac and builds the program for each. On both it
# rehearses the program updating itself (packaging/rehearse_update.py), and on Windows
# also the one-click install from source.
# Runs on every push and on demand (Actions tab -> "Build Bookwyrm" -> Run workflow).
# The finished programs appear as downloadable artifacts on the run's page. A release
# is made from them by hand; its files must keep the names they have here, because
# Bookwyrm looks for them by name when it updates itself (src/bookwyrm/updates/release.py).
name: Build Bookwyrm

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is an Apple-silicon Mac, so the Mac download is the arm64 one.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Self-test
        run: python -m bookwyrm --self-test
      - name: Build
        run: python packaging/build.py --zip
      - name: Run the built program's self-test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          start /wait "" dist\Bookwyrm\Bookwyrm.exe --self-test "%RUNNER_TEMP%\exe-selftest.txt"
          type "%RUNNER_TEMP%\exe-selftest.txt"
          findstr /c:"RESULT: all" "%RUNNER_TEMP%\exe-selftest.txt"
          dir /b dist\Bookwyrm
      - name: Run the built app's self-test, then rehearse it updating itself
        if: runner.os == 'macOS'
        run: |
          dist/Bookwyrm.app/Contents/MacOS/Bookwyrm --version
          dist/Bookwyrm.app/Contents/MacOS/Bookwyrm --self-test
          python packaging/rehearse_update.py --with-relaunch
      - name: Rehearse the built program updating itself
        if: runner.os == 'Windows'
        run: python packaging/rehearse_update.py --with-relaunch
      - name: Make the Windows source package
        if: runner.os == 'Windows'
        run: python packaging/make_windows_package.py
      - name: Install from the package the way a Windows user would
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          mkdir "%RUNNER_TEMP%\A Friend's PC"
          tar -xf dist\Bookwyrm-for-Windows.zip -C "%RUNNER_TEMP%\A Friend's PC"
          call "%RUNNER_TEMP%\A Friend's PC\Bookwyrm\Install Bookwyrm.bat" --no-launch < nul
          type "%RUNNER_TEMP%\A Friend's PC\Bookwyrm\setup-log.txt"
          findstr /c:"Bookwyrm is ready." "%RUNNER_TEMP%\A Friend's PC\Bookwyrm\setup-log.txt"
      - name: Upload the Windows programs
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Bookwyrm-${{ runner.os }}
          path: dist/Bookwyrm-*.zip
          if-no-files-found: error
      - name: Upload the Mac app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Bookwyrm-${{ runner.os }}
          path: dist/Bookwyrm-mac-*.zip
          if-no-files-found: error
