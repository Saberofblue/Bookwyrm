[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookwyrm"
version = "0.4.1"
description = "A fantasy-library PDF reader, editor and organizer"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = [
    "PySide6-Essentials==6.12.0",
    "pymupdf==2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6"]

[project.gui-scripts]
bookwyrm = "bookwyrm.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bookwyrm = ["db/*.sql", "ui/theme/*.qss", "ui/theme/assets/**/*", "ui/theme/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
qt_api = "pyside6"
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
